[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "LLmThoughtLens"
version = "0.1.0"
description = "Platform-agnostic LLM interpretability — circuit tracing, SAE features, attribution graphs, probes, and a self-contained HTML report for any LLM."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chandu Ch", email = "chanduchitikam@gmail.com" }]
keywords = [
  "llm",
  "interpretability",
  "mechanistic",
  "attribution-graph",
  "circuits",
  "sae",
  "sparse-autoencoder",
  "xai",
  "anthropic",
  "probes",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "plotly>=5.18",
  "rich>=13.7",
  "httpx>=0.26",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
huggingface = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.27",
  "h5py>=3.10",
  "scikit-learn>=1.3",
]
ollama = ["httpx>=0.26"]
tui = ["textual>=0.60", "rapidfuzz>=3.6"]
all = [
  "openai>=1.30",
  "anthropic>=0.30",
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.27",
  "h5py>=3.10",
  "scikit-learn>=1.3",
  "textual>=0.60",
  "rapidfuzz>=3.6",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.0",
  "pip-audit>=2.7",
]

[project.scripts]
LLmThoughtLens = "LLmThoughtLens.cli:main"

[project.urls]
Homepage = "https://github.com/Chandu00756/LLmThoughtLens"
Repository = "https://github.com/Chandu00756/LLmThoughtLens"
Issues = "https://github.com/Chandu00756/LLmThoughtLens/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["LLmThoughtLens"]

[tool.hatch.build.targets.sdist]
include = [
  "LLmThoughtLens",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["LLmThoughtLens", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP007", "UP045", "UP006", "UP035", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B018"]
"LLmThoughtLens/tui/*" = ["B008"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
(
  ^/\.venv/
)
'''

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q -ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
markers = [
  "integration: requires live API keys",
  "local: requires local service (Ollama)",
  "gpu: requires CUDA GPU",
  "slow: long-running",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["LLmThoughtLens"]
omit = ["tests/*", "scripts/*", "examples/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = false
check_untyped_defs = true
files = ["LLmThoughtLens"]
# TUI excluded — Textual's dynamic `query_one()` widget API doesn't expose
# concrete types statically; running mypy on those modules produces only
# false positives. Pytest still covers TUI construction.
exclude = "(\\.venv|build|dist|tests|LLmThoughtLens/tui)"
